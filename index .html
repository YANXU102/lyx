<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芦语宣 | 园艺专业 · 个人简历</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --primary-light: #40916c;
            --primary-dark: #1b4332;
            --accent: #d4a373;
            --accent-light: #e9c46a;
            --accent-dark: #b5835a;
            --bg: #f8f7f4;
            --bg-card: #ffffff;
            --bg-section: #f0ede8;
            --text: #2c3e50;
            --text-secondary: #5a6c7d;
            --text-muted: #8a9aa8;
            --border: #e2ddd6;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.1);
            --gradient-hero: linear-gradient(135deg, #1b4332 0%, #2d6a4f 40%, #40916c 70%, #52b788 100%);
            --gradient-accent: linear-gradient(135deg, #d4a373, #e9c46a);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --nav-height: 64px;
            --max-width: 1100px;
        }

        [data-theme="dark"] {
            --primary: #52b788;
            --primary-light: #74c69d;
            --primary-dark: #2d6a4f;
            --accent: #e9c46a;
            --accent-light: #f4d58d;
            --accent-dark: #d4a373;
            --bg: #121212;
            --bg-card: #1e1e1e;
            --bg-section: #181818;
            --text: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #7a7a7a;
            --border: #333333;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.45);
            --gradient-hero: linear-gradient(135deg, #0d1f17 0%, #1b4332 40%, #2d6a4f 70%, #40916c 100%);
            --gradient-accent: linear-gradient(135deg, #b5835a, #d4a373);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 16px;
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
        }

        .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary);
            letter-spacing: 0.05em;
            text-decoration: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-brand svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .navbar-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .navbar-links::-webkit-scrollbar {
            display: none;
        }

        .navbar-links a {
            display: block;
            padding: 8px 14px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 8px;
            transition: color var(--transition), background var(--transition);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .navbar-links a:hover,
        .navbar-links a:focus-visible {
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 8%, transparent);
        }
        .navbar-links a.active {
            color: var(--primary);
            font-weight: 600;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 1.1rem;
            flex-shrink: 0;
            position: relative;
        }
        .icon-btn:hover,
        .icon-btn:focus-visible {
            border-color: var(--primary);
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 6%, transparent);
            outline: none;
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .icon-btn .tooltip {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg-card);
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
            z-index: 10;
        }
        .icon-btn:hover .tooltip {
            opacity: 1;
        }

        /* ===== 主容器 ===== */
        .main-container {
            margin-top: var(--nav-height);
            max-width: var(--max-width);
            margin-left: auto;
            margin-right: auto;
            padding: 0 20px 60px;
        }

        section {
            padding: 56px 0 20px;
            scroll-margin-top: calc(var(--nav-height) + 16px);
        }

        .section-header {
            margin-bottom: 32px;
            text-align: center;
        }
        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.04em;
            position: relative;
            display: inline-block;
            padding-bottom: 12px;
        }
        .section-header h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 3px;
            border-radius: 2px;
            background: var(--gradient-accent);
        }
        .section-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* ===== Hero 区 ===== */
        .hero {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 40px;
            align-items: center;
            padding: 48px 32px;
            border-radius: var(--radius);
            background: var(--gradient-hero);
            color: #fff;
            overflow: hidden;
            position: relative;
            margin-top: 24px;
            box-shadow: var(--shadow-hover);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(233, 196, 106, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }
        .hero-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .hero .subtitle {
            font-size: 1.1rem;
            opacity: 0.85;
            font-weight: 400;
            margin-bottom: 16px;
            letter-spacing: 0.03em;
        }
        .hero .summary-text {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.8;
            margin-bottom: 24px;
            max-width: 500px;
        }
        .hero .signature {
            font-style: italic;
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 4px;
            letter-spacing: 0.05em;
            border-left: 2px solid var(--accent-light);
            padding-left: 12px;
        }

        .hero-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        .hero-skills .badge {
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            transition: background var(--transition), transform var(--transition);
            cursor: default;
            backdrop-filter: blur(8px);
        }
        .hero-skills .badge:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all var(--transition);
            font-family: inherit;
        }
        .btn-primary {
            background: #ffffff;
            color: var(--primary-dark);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            background: #f0f0f0;
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }
        .btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn-copied {
            background: var(--accent-light) !important;
            color: #1b4332 !important;
        }

        .hero-visual {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
            object-position: center 35%;
        }
        .hero-avatar svg {
            width: 80px;
            height: 80px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== 亮点成果区 ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .highlight-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            cursor: default;
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--primary) 30%, var(--border));
        }
        .highlight-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
            letter-spacing: 0.02em;
        }
        .highlight-number .unit {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-dark);
        }
        .highlight-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.03em;
        }

        /* ===== Tabs 通用 ===== */
        .tabs-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }
        .tabs-list {
            display: flex;
            gap: 4px;
            padding: 12px 16px 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: thin;
            background: color-mix(in srgb, var(--bg-section) 60%, var(--bg-card));
        }
        .tabs-list::-webkit-scrollbar {
            height: 4px;
        }
        .tabs-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }
        .tab-btn {
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 0.03em;
            position: relative;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab-btn:hover {
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 4%, transparent);
        }
        .tab-btn[aria-selected="true"] {
            color: var(--primary);
            font-weight: 600;
            background: var(--bg-card);
            border-bottom-color: var(--primary);
        }
        .tab-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
            border-radius: 8px 8px 0 0;
        }
        .tab-panel {
            padding: 24px;
            display: none;
            animation: fadeIn 220ms ease;
        }
        .tab-panel.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 时间线（经历） ===== */
        .timeline {
            position: relative;
            padding-left: 24px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: linear-gradient(to bottom, var(--primary-light), var(--accent-light));
            border-radius: 1px;
            opacity: 0.5;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 24px;
            padding-left: 8px;
        }
        .timeline-item:last-child {
            padding-bottom: 0;
        }
        .timeline-dot {
            position: absolute;
            left: -24px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid var(--bg-card);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
            z-index: 1;
        }
        .timeline-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .timeline-org {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .timeline-date {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-left: 8px;
            letter-spacing: 0.04em;
        }
        .timeline-desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-top: 6px;
            line-height: 1.75;
        }
        .timeline-desc ul {
            list-style: none;
            padding-left: 0;
            margin-top: 4px;
        }
        .timeline-desc li {
            position: relative;
            padding-left: 16px;
            margin-bottom: 4px;
        }
        .timeline-desc li::before {
            content: '·';
            position: absolute;
            left: 4px;
            color: var(--accent-dark);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* ===== 项目卡片 ===== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: default;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--primary) 30%, var(--border));
        }
        .project-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .project-tags .tag {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 500;
            background: color-mix(in srgb, var(--primary) 8%, transparent);
            color: var(--primary);
            border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);
            letter-spacing: 0.03em;
        }
        .project-result {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.7;
            flex-grow: 1;
        }
        .project-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color var(--transition);
        }
        .project-link:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }

        /* ===== 技能矩阵 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        .skill-category {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: background var(--transition), border-color var(--transition);
        }
        .skill-category h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 14px;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .skill-category h3 svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .skill-bar-row {
            margin-bottom: 12px;
        }
        .skill-bar-row:last-child {
            margin-bottom: 0;
        }
        .skill-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.82rem;
        }
        .skill-bar-name {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .skill-bar-value {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.78rem;
        }
        .skill-bar-track {
            height: 6px;
            border-radius: 3px;
            background: color-mix(in srgb, var(--text-muted) 15%, transparent);
            overflow: hidden;
        }
        .skill-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: var(--gradient-accent);
            transition: width 800ms cubic-bezier(0.4, 0, 0.2, 1);
            width: 0;
        }
        .skill-bar-fill.animated {
            width: var(--skill-width);
        }

        /* ===== 教育与证书 ===== */
        .edu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .edu-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .edu-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .edu-school {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }
        .edu-major {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.88rem;
            margin-top: 2px;
        }
        .edu-date {
            color: var(--text-muted);
            font-size: 0.78rem;

            font-weight: 700;

            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
            color: var(--accent-dark);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: all var(--transition);
            cursor: default;
        }
        .cert-badge:hover {
            background: color-mix(in srgb, var(--accent) 20%, transparent);
            transform: translateY(-2px);
        }
        .cert-badge svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .certificate-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 24px;
        }
        .certificate-item {
            width: 200px;
            max-width: 100%;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .certificate-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--primary) 30%, var(--border));

        .certificate-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            background: #fafafa;
        }
        .certificate-caption {

            font-size: 0.78rem;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.03em;
            background: color-mix(in srgb, var(--bg-card) 80%, var(--bg-section));

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 32px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            margin-top: 20px;

        .footer .heart {
            color: var(--accent-dark);
        }

            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition);
            z-index: 900;
            font-size: 1.2rem;
        }
        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .back-to-top:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .back-to-top svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: var(--bg-card);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1100;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

                height: 16px;
            }

            }

                gap: 20px;
                text-align: center;

            }

                justify-content: center;
            }
            .hero-visual {
                display: none;
            }

            .highlights-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .highlight-card {
                padding: 14px;
            }
            .highlight-number {
                font-size: 1.5rem;
            }

            .tabs-list {
                padding: 8px 10px 0;
                gap: 2px;
            }
            .tab-btn {
                padding: 8px 12px;
                font-size: 0.75rem;
            }
            .tab-panel {
                padding: 16px;
            }

            .projects-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .skills-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .edu-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            }

                left: -18px;
                width: 10px;
                height: 10px;
            }
            .timeline::before {
                left: 4px;
            }

            .back-to-top {

                right: 16px;
                width: 40px;
                height: 40px;
            }

            function createSVG(pathData, viewBox = '0 0 24 24', extra = '') {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', viewBox);
                svg.setAttribute('fill', 'none');
                svg.setAttribute('stroke', 'currentColor');
                svg.setAttribute('stroke-width', '2');
                svg.setAttribute('stroke-linecap', 'round');
                svg.setAttribute('stroke-linejoin', 'round');
                if (typeof pathData === 'string') {
                    svg.innerHTML = pathData;
                } else if (Array.isArray(pathData)) {
                    pathData.forEach(p => {
                        const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        el.setAttribute('d', p);
                        svg.appendChild(el);
                    });
                }

                }, duration);

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
                }
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    return Promise.resolve(true);
                } catch (e) {
                    return Promise.resolve(false);
                } finally {
                    document.body.removeChild(textarea);
                }
            }

            function applyTheme(theme) {
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    iconSun.style.display = 'none';
                    iconMoon.style.display = 'block';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    iconSun.style.display = 'block';
                    iconMoon.style.display = 'none';
                }
                localStorage.setItem('theme', theme);
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';

            }

            function switchExpTab(index) {
                const tabs = document.querySelectorAll('#expTabsList .tab-btn');
                const panels = document.querySelectorAll('[id^="exp-panel-"]');
                tabs.forEach((btn, i) => {
                    const selected = i === index;
                    btn.setAttribute('aria-selected', selected ? 'true' : 'false');
                    btn.setAttribute('tabindex', selected ? '0' : '-1');
                    btn.classList.toggle('active', selected);
                    if (selected) btn.focus();
                });
                panels.forEach((panel, i) => {
                    panel.classList.toggle('active', i === index);
                });
            }

            function switchProjTab(index) {
                const tabs = document.querySelectorAll('#projTabsList .tab-btn');
                const panels = document.querySelectorAll('[id^="proj-panel-"]');
                tabs.forEach((btn, i) => {
                    const selected = i === index;

                    btn.classList.toggle('active', selected);

                });
                panels.forEach((panel, i) => {
                    panel.classList.toggle('active', i === index);
                });
            }

            function handleTabKeydown(e, currentIndex, prefix, total) {
                let newIndex = null;
                switch (e.key) {
                    case 'ArrowRight':
                        e.preventDefault();
                        newIndex = (currentIndex + 1) % total;
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        newIndex = (currentIndex - 1 + total) % total;
                        break;
                    case 'Home':
                        e.preventDefault();
                        newIndex = 0;
                        break;
                    case 'End':
                        e.preventDefault();
                        newIndex = total - 1;
                        break;
                    case 'Enter':
                    case ' ':
                        e.preventDefault();
                        if (prefix === 'exp') switchExpTab(currentIndex);
                        else switchProjTab(currentIndex);
                        return;
                }
                if (newIndex !== null) {
                    if (prefix === 'exp') switchExpTab(newIndex);
                    else switchProjTab(newIndex);
                }
            }

            function animateSkillBars() {
                const bars = document.querySelectorAll('.skill-bar-fill');
                if (!bars.length) return;

                if ('IntersectionObserver' in window) {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                const el = entry.target;
                                el.classList.add('animated');
                                observer.unobserve(el);
                            }
                        });
                    }, { threshold: 0.3 });
                    bars.forEach(bar => observer.observe(bar));
                } else {
                    bars.forEach(bar => bar.classList.add('animated'));
                }
            }

            // ===== 导航高亮 =====
            function initNavHighlight() {
                const sections = ['highlights', 'experience', 'projects', 'skills', 'education'];
                const navAnchors = document.querySelectorAll('#navLinks a[data-nav]');

                function updateNav() {
                    const scrollY = window.scrollY + 100;
                    let currentSection = '';
                    sections.forEach(id => {
                        const el = document.getElementById(id);
                        if (el && el.offsetTop <= scrollY) {
                            currentSection = id;
                        }
                    });
                    navAnchors.forEach(a => {
                        const href = a.getAttribute('href').replace('#', '');
                        a.classList.toggle('active', href === currentSection);
                    });
                }
                window.addEventListener('scroll', updateNav, { passive: true });
                updateNav();
            }

            // ===== 平滑滚动 =====
            function initSmoothScroll() {
                document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function(e) {
                        const targetId = this.getAttribute('href');
                        if (targetId === '#') return;
                        const target = document.querySelector(targetId);
                        if (target) {
                            e.preventDefault();
                            const navH = document.getElementById('navbar').offsetHeight;
                            const targetPos = target.getBoundingClientRect().top + window.scrollY -
                                navH - 12;
                            window.scrollTo({ top: targetPos, behavior: 'smooth' });
                        }
                    });
                });
            }

            // ===== 返回顶部 =====
            function initBackToTop() {
                window.addEventListener('scroll', () => {
                    backToTop.classList.toggle('visible', window.scrollY > 300);
                    navbar.classList.toggle('scrolled', window.scrollY > 10);
                }, { passive: true });
                backToTop.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            // ===== 打印 =====
            function initPrint() {
                printBtn.addEventListener('click', () => {
                    window.print();
                });
            }

            // ===== 键盘快捷键 =====
            function initKeyboardShortcuts() {
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                        return;
                    }
                });
            }

            // ===== 初始化所有 =====
            function init() {
                applyTheme(getPreferredTheme());
                themeToggle.addEventListener('click', toggleTheme);

                renderHero();
                renderHighlights();
                renderExperience();
                renderProjects();
                renderSkills();
                renderEducation();
                renderFooter();

                initNavHighlight();
                initSmoothScroll();
                initBackToTop();
                initPrint();

                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (!localStorage.getItem('theme')) {
                        applyTheme(e.matches ? 'dark' : 'light');
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
