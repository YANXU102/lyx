<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芦语宣 | 园艺专业 · 个人简历</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --primary-light: #40916c;
            --primary-dark: #1b4332;
            --accent: #d4a373;
            --accent-light: #e9c46a;
            --accent-dark: #b5835a;
            --bg: #f0ede6;
            --bg-card: rgba(255, 255, 255, 0.72);
            --bg-section: rgba(255, 255, 255, 0.45);
            --text: #2c3e50;
            --text-secondary: #5a6c7d;
            --text-muted: #8a9aa8;
            --border: rgba(200, 190, 175, 0.65);
            --shadow: 0 4px 20px rgba(80, 60, 30, 0.07);
            --shadow-hover: 0 8px 32px rgba(80, 60, 30, 0.13);
            --gradient-hero: linear-gradient(135deg, rgba(27, 67, 50, 0.85) 0%, rgba(45, 106, 79, 0.78) 35%, rgba(82, 183, 136, 0.68) 70%, rgba(116, 198, 157, 0.55) 100%);
            --gradient-accent: linear-gradient(135deg, #d4a373, #e9c46a);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --nav-height: 64px;
            --max-width: 1100px;
            --sakura-color: #f5c8d8;
            --sakura-glow: rgba(245, 200, 216, 0.4);
            --bg-blur: 20px;
        }

        [data-theme="dark"] {
            --primary: #74c69d;
            --primary-light: #95d5b2;
            --primary-dark: #52b788;
            --accent: #e9c46a;
            --accent-light: #f4d58d;
            --accent-dark: #d4a373;
            --bg: #1c2420;
            --bg-card: rgba(40, 55, 47, 0.72);
            --bg-section: rgba(35, 50, 42, 0.45);
            --text: #e8ede9;
            --text-secondary: #c0c8c2;
            --text-muted: #8a9a90;
            --border: rgba(100, 130, 110, 0.5);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.38);
            --gradient-hero: linear-gradient(135deg, rgba(20, 45, 35, 0.88) 0%, rgba(35, 80, 60, 0.8) 40%, rgba(60, 130, 95, 0.7) 75%, rgba(90, 160, 120, 0.55) 100%);
            --gradient-accent: linear-gradient(135deg, #b5835a, #d4a373);
            --sakura-color: #e8b8c8;
            --sakura-glow: rgba(232, 184, 200, 0.25);
            --bg-blur: 20px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 16px;
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .sakura-container,
            .sakura-petal,
            .hero-particles,
            .glow-orb,
            .bg-decor .bg-orb {
                display: none !important;
            }
        }

        /* ===== 装饰性背景层 ===== */
        .bg-decor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: var(--bg);
            transition: background var(--transition);
        }

        .bg-decor .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.45;
            transition: opacity var(--transition), background var(--transition);
            will-change: transform;
        }

        .bg-decor .bg-orb.orb-1 {
            width: 550px;
            height: 550px;
            top: -12%;
            left: -8%;
            background: radial-gradient(circle, rgba(116, 198, 157, 0.3) 0%, transparent 70%);
            animation: orbFloat1 18s ease-in-out infinite;
        }
        .bg-decor .bg-orb.orb-2 {
            width: 650px;
            height: 650px;
            bottom: -18%;
            right: -12%;
            background: radial-gradient(circle, rgba(212, 163, 115, 0.25) 0%, transparent 70%);
            animation: orbFloat2 22s ease-in-out infinite;
        }
        .bg-decor .bg-orb.orb-3 {
            width: 400px;
            height: 400px;
            top: 35%;
            left: 30%;
            background: radial-gradient(circle, rgba(233, 196, 106, 0.22) 0%, transparent 70%);
            animation: orbFloat3 25s ease-in-out infinite;
        }
        .bg-decor .bg-orb.orb-4 {
            width: 300px;
            height: 300px;
            top: 15%;
            right: 18%;
            background: radial-gradient(circle, rgba(82, 183, 136, 0.25) 0%, transparent 70%);
            animation: orbFloat1 28s ease-in-out infinite reverse;
        }
        .bg-decor .bg-orb.orb-5 {
            width: 250px;
            height: 250px;
            bottom: 25%;
            left: 12%;
            background: radial-gradient(circle, rgba(244, 213, 141, 0.28) 0%, transparent 70%);
            animation: orbFloat2 20s ease-in-out infinite reverse;
        }

        @keyframes orbFloat1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -40px) scale(1.05);
            }
            50% {
                transform: translate(-20px, -20px) scale(0.95);
            }
            75% {
                transform: translate(10px, 30px) scale(1.08);
            }
        }
        @keyframes orbFloat2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            20% {
                transform: translate(-40px, 20px) scale(1.1);
            }
            45% {
                transform: translate(25px, -30px) scale(0.9);
            }
            70% {
                transform: translate(-15px, -10px) scale(1.05);
            }
        }
        @keyframes orbFloat3 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            30% {
                transform: translate(20px, 40px) scale(1.15);
            }
            60% {
                transform: translate(-30px, 10px) scale(0.85);
            }
            85% {
                transform: translate(15px, -25px) scale(1.02);
            }
        }

        .bg-decor .bg-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2352b788' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.4;
            filter: blur(4px);
        }

        .bg-decor .bg-frost {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(var(--bg-blur)) saturate(1.1);
            -webkit-backdrop-filter: blur(var(--bg-blur)) saturate(1.1);
            background: rgba(255, 255, 255, 0.05);
        }
        [data-theme="dark"] .bg-decor .bg-frost {
            background: rgba(20, 30, 25, 0.05);
        }

        /* ===== 樱花飘落 ===== */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .sakura-petal {
            position: absolute;
            top: -40px;
            width: 18px;
            height: 18px;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
            animation: sakuraFall linear infinite;
        }
        .sakura-petal svg {
            width: 100%;
            height: 100%;
            fill: var(--sakura-color);
            filter: drop-shadow(0 0 4px var(--sakura-glow));
            animation: petalSway ease-in-out infinite alternate;
        }
        @keyframes sakuraFall {
            0% {
                transform: translateY(-5vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            3% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) translateX(var(--drift)) rotate(var(--rotation-end));
                opacity: 0;
            }
        }
        @keyframes petalSway {
            0% {
                transform: rotate(-8deg) scale(0.9);
            }
            50% {
                transform: rotate(8deg) scale(1.1);
            }
            100% {
                transform: rotate(-5deg) scale(0.95);
            }
        }

        /* ===== Hero粒子 ===== */
        .hero-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            border-radius: var(--radius);
        }
        .particle-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            animation: floatUp linear infinite;
            opacity: 0;
            will-change: transform, opacity;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            15% {
                opacity: 0.6;
            }
            85% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-380px) scale(0.3);
                opacity: 0;
            }
        }

        /* ===== 鼠标光晕 ===== */
        .glow-orb {
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--sakura-glow) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 400ms ease;
            z-index: 0;
            will-change: transform, opacity;
        }

        /* ===== 滚动动画 ===== */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 600ms ease, transform 600ms ease;
        }
        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--bg-card);
            backdrop-filter: blur(22px) saturate(1.2);
            -webkit-backdrop-filter: blur(22px) saturate(1.2);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
        }
        .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(80, 60, 30, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary);
            letter-spacing: 0.05em;
            text-decoration: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-brand svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .navbar-links::-webkit-scrollbar {
            display: none;
        }
        .navbar-links a {
            display: block;
            padding: 8px 14px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 8px;
            transition: color var(--transition), background var(--transition);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .navbar-links a:hover,
        .navbar-links a:focus-visible {
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 10%, transparent);
        }
        .navbar-links a.active {
            color: var(--primary);
            font-weight: 600;
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 1.1rem;
            flex-shrink: 0;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .icon-btn:hover,
        .icon-btn:focus-visible {
            border-color: var(--primary);
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 8%, transparent);
            outline: none;
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .icon-btn .tooltip {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition);
            z-index: 10;
        }
        .icon-btn:hover .tooltip {
            opacity: 1;
        }

        /* ===== 主容器 ===== */
        .main-container {
            margin-top: var(--nav-height);
            max-width: var(--max-width);
            margin-left: auto;
            margin-right: auto;
            padding: 0 20px 60px;
            position: relative;
            z-index: 1;
        }
        section {
            padding: 56px 0 20px;
            scroll-margin-top: calc(var(--nav-height) + 16px);
        }
        .section-header {
            margin-bottom: 32px;
            text-align: center;
        }
        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.04em;
            position: relative;
            display: inline-block;
            padding-bottom: 12px;
        }
        .section-header h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 3px;
            border-radius: 2px;
            background: var(--gradient-accent);
        }
        .section-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* ===== 半透明卡片通用 ===== */
        .highlight-card,
        .tabs-container,
        .project-card,
        .skill-category,
        .edu-card,
        .certificate-item,
        .navbar {
            background: var(--bg-card);
            backdrop-filter: blur(14px) saturate(1.08);
            -webkit-backdrop-filter: blur(14px) saturate(1.08);
        }

        /* ===== Hero区 ===== */
        .hero {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 40px;
            align-items: center;
            padding: 48px 32px;
            border-radius: var(--radius);
            background: var(--gradient-hero);
            color: #fff;
            overflow: hidden;
            position: relative;
            margin-top: 24px;
            box-shadow: var(--shadow-hover);
            backdrop-filter: blur(14px) saturate(1.1);
            -webkit-backdrop-filter: blur(14px) saturate(1.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.07) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(233, 196, 106, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-content {
            position: relative;
            z-index: 3;
        }
        .hero-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(10px);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: background var(--transition), transform var(--transition);
            cursor: default;
        }
        .hero-badge:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .hero .subtitle {
            font-size: 1.1rem;
            opacity: 0.85;
            font-weight: 400;
            margin-bottom: 16px;
            letter-spacing: 0.03em;
        }
        .hero .summary-text {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.8;
            margin-bottom: 24px;
            max-width: 500px;
        }
        .hero .signature {
            font-style: italic;
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 4px;
            letter-spacing: 0.05em;
            border-left: 2px solid var(--accent-light);
            padding-left: 12px;
        }
        .hero-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        .hero-skills .badge {
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            transition: background var(--transition), transform var(--transition);
            cursor: default;
            backdrop-filter: blur(8px);
        }
        .hero-skills .badge:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            z-index: 3;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all var(--transition);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 400ms ease;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
        }
        .btn-primary {
            background: #fff;
            color: var(--primary-dark);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            background: #f0f0f0;
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }
        .btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn-copied {
            background: var(--accent-light) !important;
            color: #1b4332 !important;
        }
        .hero-visual {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 255, 255, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            transition: transform 400ms ease, box-shadow 400ms ease;
        }
        .hero-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
            object-position: center 35%;
        }
        .hero-avatar svg {
            width: 80px;
            height: 80px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== 亮点 ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .highlight-card {
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            cursor: default;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--primary) 30%, var(--border));
        }
        .highlight-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, color-mix(in srgb, var(--accent-light) 10%, transparent) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 400ms ease;
            pointer-events: none;
        }
        .highlight-card:hover::after {
            opacity: 1;
        }
        .highlight-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
            letter-spacing: 0.02em;
            position: relative;
            z-index: 1;
        }
        .highlight-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.03em;
            position: relative;
            z-index: 1;
        }

        /* ===== Tabs ===== */
        .tabs-container {
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            position: relative;
        }
        .tabs-list {
            display: flex;
            gap: 4px;
            padding: 12px 16px 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: thin;
            background: color-mix(in srgb, var(--bg-section) 60%, transparent);
        }
        .tabs-list::-webkit-scrollbar {
            height: 4px;
        }
        .tabs-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }
        .tab-btn {
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 0.03em;
            position: relative;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab-btn:hover {
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 5%, transparent);
        }
        .tab-btn[aria-selected="true"] {
            color: var(--primary);
            font-weight: 600;
            background: var(--bg-card);
            border-bottom-color: var(--primary);
        }
        .tab-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
            border-radius: 8px 8px 0 0;
        }
        .tab-panel {
            padding: 24px;
            display: none;
            animation: fadeIn 220ms ease;
        }
        .tab-panel.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 时间线 ===== */
        .timeline {
            position: relative;
            padding-left: 24px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: linear-gradient(to bottom, var(--primary-light), var(--accent-light));
            border-radius: 1px;
            opacity: 0.5;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 24px;
            padding-left: 8px;
        }
        .timeline-item:last-child {
            padding-bottom: 0;
        }
        .timeline-dot {
            position: absolute;
            left: -24px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid var(--bg-card);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
            z-index: 1;
            transition: transform var(--transition);
        }
        .timeline-item:hover .timeline-dot {
            transform: scale(1.3);
        }
        .timeline-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .timeline-org {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .timeline-date {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-left: 8px;
            letter-spacing: 0.04em;
        }
        .timeline-desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-top: 6px;
            line-height: 1.75;
        }
        .timeline-desc ul {
            list-style: none;
            padding-left: 0;
            margin-top: 4px;
        }
        .timeline-desc li {
            position: relative;
            padding-left: 16px;
            margin-bottom: 4px;
        }
        .timeline-desc li::before {
            content: '·';
            position: absolute;
            left: 4px;
            color: var(--accent-dark);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* ===== 项目卡片 ===== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .project-card {
            border-radius: var(--radius-sm);
            padding: 20px;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: default;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gradient-accent);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--primary) 30%, var(--border));
        }
        .project-card:hover::before {
            opacity: 1;
        }
        .project-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .project-tags .tag {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 500;
            background: color-mix(in srgb, var(--primary) 10%, transparent);
            color: var(--primary);
            border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
            letter-spacing: 0.03em;
            transition: all var(--transition);
        }
        .project-tags .tag:hover {
            background: color-mix(in srgb, var(--primary) 20%, transparent);
            transform: scale(1.05);
        }
        .project-result {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.7;
            flex-grow: 1;
        }
        .project-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color var(--transition), gap var(--transition);
        }
        .project-link:hover {
            color: var(--primary-light);
            gap: 8px;
        }

        /* ===== 技能矩阵 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        .skill-category {
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .skill-category:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .skill-category h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 14px;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .skill-category h3 svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform var(--transition);
        }
        .skill-category:hover h3 svg {
            transform: rotate(15deg);
        }
        .skill-bar-row {
            margin-bottom: 12px;
        }
        .skill-bar-row:last-child {
            margin-bottom: 0;
        }
        .skill-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.82rem;
        }
        .skill-bar-name {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .skill-bar-value {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.78rem;
        }
        .skill-bar-track {
            height: 6px;
            border-radius: 3px;
            background: color-mix(in srgb, var(--text-muted) 15%, transparent);
            overflow: hidden;
        }
        .skill-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: var(--gradient-accent);
            transition: width 800ms cubic-bezier(0.4, 0, 0.2, 1);
            width: 0;
        }
        .skill-bar-fill.animated {
            width: var(--skill-width);
        }

        /* ===== 教育 ===== */
        .edu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .edu-card {
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            position: relative;
            border: 1px solid var(--border);
        }
        .edu-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .edu-school {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }
        .edu-major {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.88rem;
            margin-top: 2px;
        }
        .edu-date {
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            margin-top: 2px;
        }
        .edu-detail {
            color: var(--text-secondary);
            font-size: 0.84rem;
            margin-top: 8px;
            line-height: 1.75;
        }
        .edu-detail ul {
            list-style: none;
            padding-left: 0;
        }
        .edu-detail li {
            position: relative;
            padding-left: 14px;
            margin-bottom: 3px;
        }
        .edu-detail li::before {
            content: '›';
            position: absolute;
            left: 2px;
            color: var(--accent-dark);
            font-weight: 700;
        }
        .cert-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }
        .cert-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            background: color-mix(in srgb, var(--accent) 15%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
            color: var(--accent-dark);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: all var(--transition);
            cursor: default;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .cert-badge:hover {
            background: color-mix(in srgb, var(--accent) 25%, transparent);
            transform: translateY(-2px);
        }
        .cert-badge svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .certificate-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 24px;
        }
        .certificate-item {
            width: 200px;
            max-width: 100%;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .certificate-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: color-mix(in srgb, var(--primary) 30%, var(--border));
        }
        .certificate-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            background: rgba(250, 250, 250, 0.75);
            transition: transform 400ms ease;
        }
        .certificate-item:hover img {
            transform: scale(1.03);
        }
        .certificate-caption {
            padding: 8px 12px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.03em;
            background: color-mix(in srgb, var(--bg-card) 80%, var(--bg-section));
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 32px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            margin-top: 20px;
            position: relative;
            z-index: 1;
            background: color-mix(in srgb, var(--bg-card) 50%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }
        .footer .heart {
            color: var(--accent-dark);
            display: inline-block;
            animation: heartBeat 2s ease-in-out infinite;
        }
        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            10% {
                transform: scale(1.2);
            }
            20% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.1);
            }
            40% {
                transform: scale(1);
            }
        }

        /* ===== 返回顶部 ===== */
        .back-to-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition);
            z-index: 900;
            font-size: 1.2rem;
        }
        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .back-to-top:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .back-to-top svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1100;
            white-space: nowrap;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 12px;
                gap: 6px;
            }
            .navbar-brand {
                font-size: 1rem;
            }
            .navbar-brand svg {
                width: 20px;
                height: 20px;
            }
            .navbar-links a {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
            .navbar-actions {
                gap: 4px;
            }
            .icon-btn {
                width: 34px;
                height: 34px;
                border-radius: 8px;
                font-size: 0.9rem;
            }
            .icon-btn svg {
                width: 16px;
                height: 16px;
            }
            .icon-btn .tooltip {
                display: none;
            }
            .main-container {
                padding: 0 12px 40px;
            }
            section {
                padding: 40px 0 16px;
            }
            .section-header h2 {
                font-size: 1.4rem;
            }
            .hero {
                grid-template-columns: 1fr;
                padding: 28px 20px;
                gap: 20px;
                text-align: center;
                margin-top: 12px;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .hero .subtitle {
                font-size: 0.95rem;
            }
            .hero .summary-text {
                font-size: 0.85rem;
                max-width: 100%;
            }
            .hero .signature {
                border-left: none;
                padding-left: 0;
                text-align: center;
            }
            .hero-skills {
                justify-content: center;
            }
            .hero-actions {
                justify-content: center;
            }
            .hero-visual {
                display: none;
            }
            .highlights-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .highlight-card {
                padding: 14px;
            }
            .highlight-number {
                font-size: 1.5rem;
            }
            .tabs-list {
                padding: 8px 10px 0;
                gap: 2px;
            }
            .tab-btn {
                padding: 8px 12px;
                font-size: 0.75rem;
            }
            .tab-panel {
                padding: 16px;
            }
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .skills-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .edu-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .timeline {
                padding-left: 18px;
            }
            .timeline-dot {
                left: -18px;
                width: 10px;
                height: 10px;
            }
            .timeline::before {
                left: 4px;
            }
            .back-to-top {
                bottom: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
            }
            .certificate-item {
                width: calc(50% - 10px);
            }
        }
        @media (max-width: 480px) {
            .navbar-links a {
                padding: 5px 7px;
                font-size: 0.7rem;
            }
            .navbar-brand span {
                font-size: 0.85rem;
            }
            .hero {
                padding: 20px 14px;
            }
            .hero h1 {
                font-size: 1.6rem;
            }
            .hero-actions .btn {
                padding: 8px 14px;
                font-size: 0.78rem;
            }
            .highlights-grid {
                grid-template-columns: 1fr;
            }
            .certificate-item {
                width: 100%;
            }
        }

        /* ===== 打印 ===== */
        @media print {
            :root {
                --bg: #ffffff;
                --bg-card: #ffffff;
                --bg-section: #f5f5f5;
                --text: #222;
                --text-secondary: #444;
                --text-muted: #666;
                --border: #ddd;
                --primary: #2d6a4f;
                --primary-light: #40916c;
                --accent: #b5835a;
                --accent-dark: #8b5e3c;
                --shadow: none;
                --shadow-hover: none;
                --gradient-hero: none;
                --sakura-color: transparent;
                --sakura-glow: transparent;
            }
            .navbar,
            .back-to-top,
            .toast,
            .icon-btn,
            .sakura-container,
            .hero-particles,
            .glow-orb,
            .bg-decor {
                display: none !important;
            }
            .navbar-actions {
                display: none !important;
            }
            .main-container {
                margin-top: 0;
                padding: 0;
                max-width: 100%;
            }
            section {
                padding: 20px 0;
                scroll-margin-top: 0;
            }
            .hero {
                background: #f0f0f0 !important;
                color: #222 !important;
                box-shadow: none;
                padding: 24px;
                grid-template-columns: 1fr;
                text-align: left;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .hero h1 {
                font-size: 1.8rem;
                color: #222;
            }
            .hero .summary-text,
            .hero .subtitle,
            .hero .signature {
                color: #444;
                opacity: 1;
            }
            .hero-skills .badge {
                background: #eee;
                border-color: #ccc;
                color: #333;
                backdrop-filter: none;
            }
            .hero-actions .btn {
                display: none;
            }
            .hero-visual {
                display: none;
            }
            .hero::before,
            .hero::after {
                display: none;
            }
            .tab-panel {
                display: block !important;
                animation: none;
            }
            .tabs-list {
                display: none !important;
            }
            .tabs-container {
                border: none;
                box-shadow: none;
                background: #fff;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .tab-panel {
                padding: 8px 0;
            }
            .highlight-card,
            .project-card,
            .skill-category,
            .edu-card,
            .certificate-item {
                box-shadow: none;
                border: 1px solid #ddd;
                break-inside: avoid;
                page-break-inside: avoid;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: #fff;
            }
            .highlight-card:hover,
            .project-card:hover,
            .edu-card:hover,
            .certificate-item:hover {
                transform: none;
                box-shadow: none;
            }
            .skill-bar-fill {
                width: var(--skill-width) !important;
                animation: none;
                transition: none;
            }
            .footer {
                border-top: 1px solid #ddd;
                color: #666;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: transparent;
            }
            .hero-badge {
                background: #e0e0e0;
                color: #333;

                textarea.value = text;

            function applyTheme(theme) {

                } else {

                header.appendChild(createEl('p', null, '可量化的关键成绩'));
                section.appendChild(header);
                const grid = createEl('div', 'highlights-grid');
                resume.hero.highlights.forEach(h => {
                    const card = createEl('div', 'highlight-card');
                    card.appendChild(createEl('span', 'highlight-number', h.number));
                    card.appendChild(createEl('div', 'highlight-label', h.label));
                    grid.appendChild(card);
                });
                section.appendChild(grid);
                mainContainer.appendChild(section);
            }

            function renderExperience() {
                const section = createEl('section', 'scroll-reveal');
                section.id = 'experience';
                section.setAttribute('aria-label', '经历');
                const header = createEl('div', 'section-header');
                header.appendChild(createEl('h2', null, '个人经历'));
                header.appendChild(createEl('p', null, '成长轨迹与关键角色'));
                section.appendChild(header);
                const tabsContainer = createEl('div', 'tabs-container');
                const tabsList = createEl('div', 'tabs-list');
                tabsList.id = 'expTabsList';
                resume.experiences.tabs.forEach((tab, index) => {
                    const btn = createEl('button', 'tab-btn');
                    btn.id = 'exp-tab-' + tab.id;
                    btn.setAttribute('role', 'tab');
                    btn.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
                    btn.setAttribute('aria-controls', 'exp-panel-' + tab.id);
                    btn.setAttribute('tabindex', index === 0 ? '0' : '-1');
                    btn.textContent = tab.label;
                    btn.addEventListener('click', () => switchTab('exp', index));
                    btn.addEventListener('keydown', (e) => handleTabKeydown(e, index, 'exp', resume.experiences.tabs
                        .length));
                    tabsList.appendChild(btn);
                });
                tabsContainer.appendChild(tabsList);
                resume.experiences.tabs.forEach((tab, index) => {
                    const panel = createEl('div', 'tab-panel' + (index === 0 ? ' active' : ''));
                    panel.id = 'exp-panel-' + tab.id;
                    panel.setAttribute('role', 'tabpanel');
                    panel.setAttribute('aria-labelledby', 'exp-tab-' + tab.id);
                    panel.setAttribute('tabindex', '0');
                    const data = resume.experiences.content[tab.id];
                    const timeline = createEl('div', 'timeline');
                    const item = createEl('div', 'timeline-item');
                    item.appendChild(createEl('div', 'timeline-dot'));
                    item.appendChild(createEl('div', 'timeline-title', data.title));
                    const metaLine = createEl('div');
                    metaLine.appendChild(createEl('span', 'timeline-org', data.org));
                    metaLine.appendChild(createEl('span', 'timeline-date', data.date));
                    item.appendChild(metaLine);
                    const desc = createEl('div', 'timeline-desc');
                    const ul = createEl('ul');
                    data.items.forEach(li => ul.appendChild(createEl('li', null, li)));
                    desc.appendChild(ul);
                    item.appendChild(desc);
                    timeline.appendChild(item);
                    panel.appendChild(timeline);
                    tabsContainer.appendChild(panel);
                });
                section.appendChild(tabsContainer);
                mainContainer.appendChild(section);
            }

            function renderProjects() {
                const section = createEl('section', 'scroll-reveal');
                section.id = 'projects';
                section.setAttribute('aria-label', '实践项目');
                const header = createEl('div', 'section-header');
                header.appendChild(createEl('h2', null, '实践项目'));
                header.appendChild(createEl('p', null, '专业实践与综合能力展示'));
                section.appendChild(header);
                const tabsContainer = createEl('div', 'tabs-container');
                const tabsList = createEl('div', 'tabs-list');
                tabsList.id = 'projTabsList';
                resume.projects.tabs.forEach((tab, index) => {
                    const btn = createEl('button', 'tab-btn');
                    btn.id = 'proj-tab-' + tab.id;
                    btn.setAttribute('role', 'tab');
                    btn.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
                    btn.setAttribute('aria-controls', 'proj-panel-' + tab.id);
                    btn.setAttribute('tabindex', index === 0 ? '0' : '-1');
                    btn.textContent = tab.label;
                    btn.addEventListener('click', () => switchTab('proj', index));
                    btn.addEventListener('keydown', (e) => handleTabKeydown(e, index, 'proj', resume.projects.tabs
                        .length));
                    tabsList.appendChild(btn);
                });
                tabsContainer.appendChild(tabsList);
                resume.projects.tabs.forEach((tab, index) => {
                    const panel = createEl('div', 'tab-panel' + (index === 0 ? ' active' : ''));
                    panel.id = 'proj-panel-' + tab.id;
                    panel.setAttribute('role', 'tabpanel');
                    panel.setAttribute('aria-labelledby', 'proj-tab-' + tab.id);
                    panel.setAttribute('tabindex', '0');
                    const data = resume.projects.content[tab.id];
                    const grid = createEl('div', 'projects-grid');
                    const card = createEl('div', 'project-card');
                    card.appendChild(createEl('div', 'project-name', data.name));
                    const tags = createEl('div', 'project-tags');
                    data.tags.forEach(tag => tags.appendChild(createEl('span', 'tag', tag)));
                    card.appendChild(tags);
                    card.appendChild(createEl('div', 'project-result', data.result));
                    if (data.link) {
                        const link = createEl('a', 'project-link', '查看详情 →');
                        link.href = data.link;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        card.appendChild(link);
                    }
                    grid.appendChild(card);
                    panel.appendChild(grid);
                    tabsContainer.appendChild(panel);
                });
                section.appendChild(tabsContainer);
                mainContainer.appendChild(section);
            }

            function renderSkills() {
                const section = createEl('section', 'scroll-reveal');
                section.id = 'skills';
                section.setAttribute('aria-label', '技能矩阵');
                const header = createEl('div', 'section-header');
                header.appendChild(createEl('h2', null, '技能矩阵'));
                header.appendChild(createEl('p', null, '专业能力与通用素养'));
                section.appendChild(header);
                const grid = createEl('div', 'skills-grid');
                resume.skills.categories.forEach(cat => {
                    const catCard = createEl('div', 'skill-category');
                    const h3 = createEl('h3', null, cat.name);
                    h3.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg> ' +
                        cat.name;
                    catCard.appendChild(h3);
                    cat.items.forEach(item => {
                        const row = createEl('div', 'skill-bar-row');
                        const barHeader = createEl('div', 'skill-bar-header');
                        barHeader.appendChild(createEl('span', 'skill-bar-name', item.name));
                        barHeader.appendChild(createEl('span', 'skill-bar-value', item.level + '%'));
                        const track = createEl('div', 'skill-bar-track');
                        const fill = createEl('div', 'skill-bar-fill');
                        fill.style.setProperty('--skill-width', item.level + '%');
                        track.appendChild(fill);
                        row.appendChild(barHeader);
                        row.appendChild(track);
                        catCard.appendChild(row);
                    });
                    grid.appendChild(catCard);
                });
                section.appendChild(grid);
                mainContainer.appendChild(section);
                animateSkillBars();
            }

            function animateSkillBars() {
                const bars = document.querySelectorAll('.skill-bar-fill');
                if (!bars.length) return;
                if ('IntersectionObserver' in window) {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('animated');
                                observer.unobserve(entry.target);
                            }
                        });
                    }, { threshold: 0.3 });
                    bars.forEach(bar => observer.observe(bar));
                } else {
                    bars.forEach(bar => bar.classList.add('animated'));
                }
            }

            function renderEducation() {
                const section = createEl('section', 'scroll-reveal');
                section.id = 'education';
                section.setAttribute('aria-label', '教育与证书');
                const header = createEl('div', 'section-header');
                header.appendChild(createEl('h2', null, '教育与证书'));
                header.appendChild(createEl('p', null, '教育背景与专业资质'));
                section.appendChild(header);
                const grid = createEl('div', 'edu-grid');
                resume.education.forEach(edu => {
                    const card = createEl('div', 'edu-card');
                    card.appendChild(createEl('div', 'edu-school', edu.school));
                    card.appendChild(createEl('div', 'edu-major', edu.major));
                    card.appendChild(createEl('div', 'edu-date', edu.date));
                    const details = createEl('div', 'edu-detail');
                    const ul = createEl('ul');
                    edu.details.forEach(d => ul.appendChild(createEl('li', null, d)));
                    details.appendChild(ul);
                    card.appendChild(details);
                    grid.appendChild(card);
                });
                section.appendChild(grid);
                if (resume.certificates && resume.certificates.length) {
                    const certContainer = createEl('div', 'cert-badges');
                    resume.certificates.forEach(cert => {
                        const badge = createEl('span', 'cert-badge');
                        badge.innerHTML =
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/></svg> ' +
                            cert.name;
                        certContainer.appendChild(badge);
                    });
                    section.appendChild(certContainer);
                }
                if (resume.certificatesImages && resume.certificatesImages.length) {
                    const gallery = createEl('div', 'certificate-gallery');
                    resume.certificatesImages.forEach(imageSrc => {
                        const item = createEl('div', 'certificate-item');
                        const img = createEl('img');
                        img.src = imageSrc;
                        img.alt = '证书展示';
                        img.loading = 'lazy';
                        let captionText = '个人证书';
                        if (imageSrc.includes('zhengshu')) captionText = '人工智能训练师（初级）';
                        else if (imageSrc.includes('gaoji')) captionText = '人工智能训练师（高级）';
                        item.appendChild(img);
                        item.appendChild(createEl('div', 'certificate-caption', captionText));
                        gallery.appendChild(item);
                    });
                    section.appendChild(gallery);
                }
                mainContainer.appendChild(section);
            }

            function renderFooter() {
                const footer = createEl('footer', 'footer');
                const copyright = createEl('div', null, resume.footer.copyright);
                copyright.appendChild(createEl('span', 'heart', ' ♥ '));
                footer.appendChild(copyright);
                footer.appendChild(createEl('div', null, resume.footer.updated));
                mainContainer.appendChild(footer);
            }

            function switchTab(prefix, index) {
                const tabs = document.querySelectorAll('#' + prefix + 'TabsList .tab-btn');
                const panels = document.querySelectorAll('[id^="' + prefix + '-panel-"]');
                tabs.forEach((btn, i) => {
                    const selected = i === index;
                    btn.setAttribute('aria-selected', selected ? 'true' : 'false');
                    btn.setAttribute('tabindex', selected ? '0' : '-1');
                    btn.classList.toggle('active', selected);
                    if (selected) btn.focus();
                });
                panels.forEach((panel, i) => panel.classList.toggle('active', i === index));
            }

            function handleTabKeydown(e, currentIndex, prefix, total) {
                let newIndex = null;
                switch (e.key) {
                    case 'ArrowRight':
                        e.preventDefault();
                        newIndex = (currentIndex + 1) % total;
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        newIndex = (currentIndex - 1 + total) % total;
                        break;
                    case 'Home':
                        e.preventDefault();
                        newIndex = 0;
                        break;
                    case 'End':
                        e.preventDefault();
                        newIndex = total - 1;
                        break;
                    case 'Enter':
                    case ' ':
                        e.preventDefault();
                        switchTab(prefix, currentIndex);
                        return;
                }
                if (newIndex !== null) switchTab(prefix, newIndex);
            }

            function initNavHighlight() {
                const sections = ['highlights', 'experience', 'projects', 'skills', 'education'];
                const navAnchors = document.querySelectorAll('#navLinks a[data-nav]');

                function updateNav() {
                    const scrollY = window.scrollY + 100;
                    let currentSection = '';
                    sections.forEach(id => {
                        const el = document.getElementById(id);
                        if (el && el.offsetTop <= scrollY) currentSection = id;
                    });
                    navAnchors.forEach(a => {
                        a.classList.toggle('active', a.getAttribute('href').replace('#', '') ===
                            currentSection);
                    });
                }
                window.addEventListener('scroll', updateNav, { passive: true });
                updateNav();
            }

            function initSmoothScroll() {
                document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function(e) {
                        const targetId = this.getAttribute('href');
                        if (targetId === '#') return;
                        const target = document.querySelector(targetId);
                        if (target) {
                            e.preventDefault();
                            const navH = document.getElementById('navbar').offsetHeight;
                            const targetPos = target.getBoundingClientRect().top + window.scrollY - navH -
                                12;
                            window.scrollTo({ top: targetPos, behavior: 'smooth' });
                        }
                    });
                });
            }

            function initBackToTop() {
                window.addEventListener('scroll', () => {
                    backToTop.classList.toggle('visible', window.scrollY > 300);
                    navbar.classList.toggle('scrolled', window.scrollY > 10);
                }, { passive: true });
                backToTop.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            function initPrint() {
                printBtn.addEventListener('click', () => window.print());
            }

            function init() {
                applyTheme(getPreferredTheme());
                themeToggle.addEventListener('click', toggleTheme);
                renderHero();
                renderHighlights();
                renderExperience();
                renderProjects();
                renderSkills();
                renderEducation();
                renderFooter();
                initNavHighlight();
                initSmoothScroll();
                initBackToTop();
                initPrint();
                initSakuraFall();
                initGlowOrb();
                initScrollReveal();
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'dark' : 'light');
                });
                setTimeout(() => {
                    const heroSection = document.querySelector('.hero');
                    if (heroSection) heroSection.closest('.scroll-reveal')?.classList.add('revealed');
                }, 100);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
